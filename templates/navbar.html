<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">FV</span>
      <span class="brand-text">FabricVision</span>
    </a>
    <div class="nav-actions">
      {% if user.is_authenticated %}
        <span class="pill">
          Credits: {{ user_profile.credits_remaining|default:"0" }}
        </span>
        <span class="pill ghost">
          Account: {{ user_profile.account_type|title|default:"Customer" }}
        </span>
        <a class="nav-link" href="{% url 'accounts_profile' %}">Profile</a>
        <form method="post" action="{% url 'accounts_logout' %}">
          {% csrf_token %}
          <button class="btn-secondary" type="submit">Logout</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'accounts_login' %}">Login</a>
        <a class="btn-primary" href="{% url 'accounts_register' %}">Create account</a>
      {% endif %}
    </div>
  </div>
</nav>
